# ---------------------------------------------------------------------------
# The two cottons (Wen et al. 2026). Both ORIGINATE HERE -- neither csRNAnet nor
# plant-design has an entry -- so push them upstream before using cotton beyond
# this repo, or a locus in test here becomes train there.
#
# Names are NCBI RefSeq ACCESSIONS, not the community Chr01 / A01-D13 labels,
# because FASTA and annotation both come from the same RefSeq release and
# extract_loci matches literally. A readable-but-wrong name yields zero loci in
# silence. The A/D mapping below is from the assembly report, not assumed.
#
# Assigned from peak counts as always:
#     python config/write_split_csvs.py --peak-counts -e G.arboreum-ovule_GROcap
#     python config/write_split_csvs.py --peak-counts -e G.hirsutum-ovule_GROcap
# ---------------------------------------------------------------------------

# G.arboreum -- diploid AA, 13 chromosomes, 95,714 peaks, target 19,143.
# Exhaustively optimal: spread 2,694 (14.1% of target), which is in family with
# C.griseus (17.5%) and C.elegans (12%). No pairing constraint applies.
#   fold 0 19,968 (20.9%)   fold 1 19,607 (20.5%)   fold 2 20,356 (21.3%)
#   fold 3 18,121 (18.9%)   fold 4 17,662 (18.5%)
G.arboreum:
  0: ["NC_069070.1", "NC_069073.1", "NC_069078.1"]
  1: ["NC_069071.1", "NC_069076.1", "NC_069079.1"]
  2: ["NC_069072.1", "NC_069075.1", "NC_069082.1"]
  3: ["NC_069074.1", "NC_069081.1"]
  4: ["NC_069077.1", "NC_069080.1"]

# G.hirsutum -- tetraploid AD, 26 chromosomes, 171,640 peaks, target 34,328.
#
# HOMOEOLOGS SHARE A FOLD. A0i and D0i are ~96%+ identical, so splitting a pair
# across train/test puts recognisably the same sequence on both sides (~85
# differences per 2114 bp window). That would inflate the tetraploid side of the
# diploid-vs-tetraploid comparison these two libraries exist to make. Same rule
# as the C.griseus chromosome-1 arms: judge the sequence by what it is.
#
# The pairing is exact and was read from the assembly report for
# GCF_007990345.1, not inferred: NC_053424.1-NC_053436.1 are A01-A13 and
# NC_053437.1-NC_053449.1 are D01-D13, so the homoeolog of index i is i+13.
#
# It costs real balance and the cost is stated rather than hidden: spread 6,509
# (19.0% of target), the worst in this file, against 950 (2.8%) if the 26
# chromosomes were free. Both figures are optimal for their constraint --
# exhaustive over every partition of the 13 pair-units into 5 non-empty blocks
# for the former, extensive local search for the latter. Most of the excess is
# structural: A05+D05 (18,113) and A11+D11 (16,700) are half a fold each.
# DO NOT "rebalance" this by separating a pair.
#
#   fold 0 36,732 (21.4%)   fold 1 36,854 (21.5%)   fold 2 36,009 (21.0%)
#   fold 3 31,700 (18.5%)   fold 4 30,345 (17.7%)
G.hirsutum:
  # A01 A02 A13 / D01 D02 D13
  0: ["NC_053424.1", "NC_053425.1", "NC_053436.1", "NC_053437.1", "NC_053438.1", "NC_053449.1"]
  # A03 A06 A07 / D03 D06 D07
  1: ["NC_053426.1", "NC_053429.1", "NC_053430.1", "NC_053439.1", "NC_053442.1", "NC_053443.1"]
  # A04 A09 A10 / D04 D09 D10
  2: ["NC_053427.1", "NC_053432.1", "NC_053433.1", "NC_053440.1", "NC_053445.1", "NC_053446.1"]
  # A05 A08 / D05 D08
  3: ["NC_053428.1", "NC_053431.1", "NC_053441.1", "NC_053444.1"]
  # A11 A12 / D11 D12
  4: ["NC_053434.1", "NC_053435.1", "NC_053447.1", "NC_053448.1"]

# S.moellendorffii is deliberately absent, for the same structural reason as
# S.pombe but more starkly: v1.0 has NO chromosomes at all (759 scaffolds,
# empty Ensembl karyotype), so chromosome folds do not exist to be assigned.
# It uses peak-level folds only --
# config/splits/S.moellendorffii_random_fold_assignments.csv, written by
# src/data_preprocessing/make_random_splits.py (already generic; pass
# --experiment/--output). Do NOT add an entry here.
#
# C.griseus WAS absent pending peaks and is now assigned above, from
# C.griseus-CHO_GROcap. Reproduce with
#     python config/write_split_csvs.py --peak-counts -e C.griseus-CHO_GROcap
# Never fill an entry in by sequence length -- that is not this project's
# method, and it is exactly how the C.elegans entry went wrong.
