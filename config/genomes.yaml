  C.griseus:
    # Chinese hamster. NOT an ENCODE organism, so bare Ensembl names.
    # CriGri-PICRH-1.0 assembles only TEN chromosomes -- 2,3,4,5,6,7,8,9,10,X.
    # Chromosome 1 is genuinely NOT assembled: it remains unplaced as
    # RAZU02000001.1 (275.7 Mb) and RAZU02000002.1 (274.4 Mb), which are almost
    # certainly its two arms. Verified from BOTH sides -- Ensembl reports 10
    # karyotype entries with no "1", and NCBI GCF_003668045.3 lists exactly 10
    # assembled-molecule records (NC_048595.1-NC_048604.1) -- so this is the
    # assembly, not an Ensembl quirk.
    #
    # Those two scaffolds ARE in main_chromosomes, breaking the usual
    # "scaffolds cannot enter a fold" rule ON PURPOSE. They are chromosome-scale
    # (each larger than mouse chr1) and carry 23% of the genome; excluding them
    # would discard all of chromosome 1. This is the same reasoning applied to
    # S. pombe's MTR/AB325691 -- judge the sequence by what it IS, not by the
    # label the assembly happens to give it.
    assembly: CriGri-PICRH-1.0
    n_chromosomes: 8    # caps PINTS --thread; 12 fold units, so the cap binds
    main_chromosomes: [2, 3, 4, 5, 6, 7, 8, 9, 10, X, RAZU02000001.1, RAZU02000002.1]
    annotation_url: https://ftp.ensembl.org/pub/release-115/gff3/cricetulus_griseus_picr/Cricetulus_griseus_picr.CriGri-PICRH-1.0.115.gff3.gz
    annotation_format: gff3
    assembly_accession: GCA_003668045.2   # RefSeq counterpart GCF_003668045.3
    fasta_url: https://ftp.ensembl.org/pub/release-115/fasta/cricetulus_griseus_picr/dna/Cricetulus_griseus_picr.CriGri-PICRH-1.0.dna.toplevel.fa.gz
    fasta: data/Cricetulus_griseus_picr.CriGri-PICRH-1.0.dna.toplevel.fa
    # Does this annotation's gene/transcript START mark the TSS?
    # Used ONLY to decide whether the QC metaplot may raise a flag: where this is
    # false the metaplot is advisory, because it measures the annotation's reference
    # point rather than the pipeline. Set from annotation PROVENANCE, not by fitting
    # to the observed ratio. Ensembl CriGri-PICRH-1.0 models carry UTRs. Observed dn/up 2.6-3.6.
    annotation_tss_anchored: true
    chrom_style: ensembl       # bare 2-10, X, plus RAZU* scaffolds
    star_sa_index_nbases: 14   # 2366.6 Mb -- the largest genome in this repo
    blacklist: null
    blacklist_source: >-
      None published. Boyle-Lab/Blacklist ships ce10, ce11, dm3, dm6, hg19,
      hg38, mm10 only, and excluderanges has no Chinese hamster entry.
    # Organelle decoy. CriGri-PICRH-1.0 assembles 10 molecules (chr2-chr10, X)
    # and NO mitochondrion -- NCBI's assembly_report for GCF_003668045.3 lists
    # no MT, and Ensembl reports no organelle-named toplevel region. Added for
    # the decoy rationale (NUMTs would otherwise attract these reads), not for
    # yield: only 0.3% of SRR12774945 is mitochondrial, against 12.2% plastid
    # for C.reinhardtii. Drop it if the re-index cost is not worth 0.3%.
    # Organelle contigs ALREADY IN this assembly. Needed so
    # src/qc/rrna_content.py can measure organellar content -- it would
    # otherwise score only against data/decoy/ and report 0% for every
    # species whose organelles are in the reference, which is 7 of 10.
    # In-assembly rDNA, as contig or contig:start-end (1-based inclusive).
    # Only needed where the annotation carries no `rRNA` feature: the three
    # UCSC species use refGene GTF, which types everything exon/CDS/
    # transcript. Without this, src/qc/rrna_content.py measured 0.9% for
    # D. melanogaster and 0.5% for C. elegans -- organellar only, with
    # nuclear rRNA silently unmeasured but looking like a real number.
    rdna_regions: []   # GFF3 rRNA features cover it
    organelle_contigs: []  # absent; supplied via organelle_accessions
    organelle_accessions: [DQ390542]          # mtDNA 16,284 bp
    rdna_accession: null
    #   UNVERIFIED and left null, but this is the species most likely to WANT a sink:
    #   it is a rodent, and mouse needed BK000964.3 because the array is absent from
    #   mm10. No Chinese hamster rDNA reference exists to use -- ENA returns zero hits
    #   for Cricetulus griseus "ribosomal DNA" / "complete repeating unit", so unlike
    #   mouse there is no analogue of BK000964.3 to fetch. Revisit if the initiator
    #   logo or peak set shows rRNA-like contamination.
    rdna_note: >-
      No sink available; PRO-cap/GRO-cap libraries carry abundant Pol I reads,
      so rDNA-like mismapping is an untested exposure for this species.

# Spike-in genomes. The manifest requires spike-in reads to be split off and
# never used as target labels; align jointly, then keep only primary-genome
# reads for signal generation.
  # ---------------------------------------------------------------- cotton
  # Wen2026_cotton_GROcap. THE REPO'S FIRST NCBI-SOURCED GENOMES: neither
  # species is in Ensembl Plants (which carries only G. raimondii), so FASTA and
  # annotation both come from the same NCBI RefSeq release, which is what keeps
  # their sequence names consistent -- the requirement `chrom_style` exists to
  # record. The names are RefSeq accessions rather than the community Chr01 /
  # A01-D13 labels, so main_chromosomes is accessions too; extract_loci matches
  # literally, and a readable-but-wrong name would silently yield zero loci.
  # The Chr/A/D mapping is in each assembly's *_assembly_report.txt.
  #
  # Both include MT and Pltd, so no organelle decoys are needed (unlike
  # C.reinhardtii and P.patens); they are recorded in organelle_contigs so
  # rrna_content.py can measure organellar content, and excluded from
  # main_chromosomes so they never reach a fold.
  G.arboreum:
    assembly: ASM2569848v2
    assembly_accession: GCF_025698485.1
    n_chromosomes: 13
    # Chr01-Chr13 as RefSeq accessions.
    main_chromosomes: [
      NC_069070.1, NC_069071.1, NC_069072.1, NC_069073.1,
      NC_069074.1, NC_069075.1, NC_069076.1, NC_069077.1,
      NC_069078.1, NC_069079.1, NC_069080.1, NC_069081.1,
      NC_069082.1,
    ]
    fasta_url: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/025/698/485/GCF_025698485.1_ASM2569848v2/GCF_025698485.1_ASM2569848v2_genomic.fna.gz
    fasta: data/GCF_025698485.1_ASM2569848v2_genomic.fna
    annotation_url: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/025/698/485/GCF_025698485.1_ASM2569848v2/GCF_025698485.1_ASM2569848v2_genomic.gff.gz
    annotation_format: gff3
    annotation_tss_anchored: true
    chrom_style: ncbi_refseq
    # 1.62 Gb -> min(14, log2(len)/2 - 1) = 14, so this is a LARGE_GENOME and
    # gets the 40 GB align/index reservation automatically.
    star_sa_index_nbases: 14
    blacklist: null
    blacklist_source: None published; not in Boyle-Lab/Blacklist or excluderanges.
    rdna_accession: null
    rdna_note: >-
      UNCHECKED. Organelles are in the assembly; whether the 45S array is has not
      been verified, so null per the default-deny rule for rdna_accession.
    rdna_regions: []
    organelle_accessions: []
    organelle_contigs: [NC_035073.1, NC_016712.1]   # MT 687 kb; Pltd 160 kb

  # G. hirsutum is TETRAPLOID (AD1): 13 A-subgenome plus 13 D-subgenome
  # chromosomes, homoeologous at ~96%+. The ENCODE MAPQ 255 unique filter
  # therefore discards reads that cannot be assigned to one subgenome, and that
  # bites hardest on the SHORT GRO-cap inserts -- a 30 bp window may contain no
  # distinguishing difference at all. The paper reports 124M unique of 577M pairs
  # using relaxed STAR settings (--outFilterMatchNminOverLread 0.33); ours are
  # stricter, so expect a lower pct_unique for structural reasons rather than
  # library-quality ones. Read it against the measured value, not this note.
  G.hirsutum:
    assembly: Gossypium_hirsutum_v2.1
