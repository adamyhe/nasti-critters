# Per-species genome resources
#
# NO_ALT AUDIT (done; no action needed). ENCODE aligns to no_alt references
# because a locus represented twice (primary + alt) turns its reads into
# multi-mappers, which `--outFilterMultimapNmax 10` + MAPQ 255 then discard,
# leaving a hole exactly where the duplication is. Every reference below was
# checked against its real contig list, and ALL SIX ARE ALREADY ALT-FREE:
#
#   dm6       1,870 contigs = 8 primary + 645 *_random + 1,217 chrUn_*, 0 alt
#   mm10         66 contigs = 22 primary + 22 *_random + 22 chrUn_*, 0 alt.
#             Contig names and lengths are IDENTICAL to ENCODE's
#             mm10_no_alt_analysis_set_ENCODE (diffed against ENCODE's own
#             mm10_no_alt.chrom.sizes), so UCSC mm10 already is that set.
#   ce11          7 contigs = 6 chromosomes + chrM, 0 alt
#   R64-1-1      17 contigs = 16 chromosomes + Mito, 0 alt
#   TAIR10        7 contigs = 5 chromosomes + Mt + Pt, 0 alt
#   ASM294v2      6 contigs = I, II, III, MT, MTR, AB325691, 0 alt
#
# S. POMBE'S TWO EXTRA CONTIGS ARE NOT ALTS -- do not exclude them. Both are
# additional UNIQUE sequence that the chromosome-level assembly lacks, which is
# the opposite of an alternate representation:
#   MTR       = FP565355, 20,128 bp, "S. pombe chromosome mating type region".
#               The silent mat2-P/mat3-M cassettes. A distinct locus, not a
#               second copy of mat1 (which is on II). Dropping it would push
#               mat2/mat3 reads onto mat1 via the shared H1/H2/H3 homology
#               boxes and MANUFACTURE signal there.
#   AB325691  = 20,000 bp, gap-filling sequence between SPBPB21E7.09 and
#               SPBPB10D8.01 on the left arm of chromosome II (Sasaki et al.
#               2008, Yeast 25(9):673-679, PMID 18727152). Sequence MISSING
#               from II, supplied separately. Dropping it discards real
#               sequence and sends its reads elsewhere.
# Neither appears in NCBI's ASM294v2 (GCA_000002945.2 has only I, II, III, MT);
# they are PomBase/Ensembl additions, and Ensembl gives both coord_system
# "chromosome", not scaffold or alt.
#
# The mat1/mat2/mat3 cassettes do multimap against each other, but that is
# ordinary biological repetition -- like rDNA, transposons or gene families --
# and is never fixed by deleting a copy from the reference.
#
# Ensembl dna.toplevel is the correct file here, not an oversight: Ensembl only
# emits dna.primary_assembly when toplevel contains haplotypes or patches, and
# no such file exists for any of the three Ensembl species (directory-listed).
#
# Organelles (chrM/Mito/MT/Mt/Pt) are kept deliberately: they act as decoys,
# absorbing organellar reads that would otherwise mismap onto nuclear
# NUMT/NUPT copies. They cannot reach a fold -- chrom_splits.yaml lists only
# main chromosomes -- so no organellar locus enters train, validation or test. for the ENCODE PRO-cap pipeline.
#
# The ENCODE PRO-cap pipeline (planning/20240501_PRO-cap_Computational_Pipeline.pdf)
# aligns to the primary assembly *plus* an rDNA decoy sequence, so that rRNA
# reads are absorbed by the decoy instead of mismapping into the genome. The
# published spec uses hg38 + U13369.1 for human; each species here needs its own
# equivalent.
#
# star_sa_index_nbases: STAR --genomeSAindexNbases, which must be reduced from
# the default 14 for small genomes (STAR's own rule: min(14, log2(len)/2 - 1)).
#
# chrom_style records whether the FASTA (and therefore every BED/bigWig derived
# from it) carries UCSC "chr" prefixes. config/chrom_splits.yaml must use names
# in the same style, because tangermeme's extract_loci matches chromosome names
# literally.

species:
  D.melanogaster:
    assembly: dm6              # modENCODE/ENCODE standard for D. melanogaster
    n_chromosomes: 6    # 2L 2R 3L 3R 4 X; caps PINTS --thread
    # Chromosomes the pipeline actually works on. bigWigs and PINTS are
    # restricted to these: scaffolds cannot enter a fold, and sparse
    # coverage on them makes the pl and mn bigWigs disagree, which PINTS
    # rejects outright ("bw_pl and bw_mn should have the same chromosomes").
    main_chromosomes: [chr2L, chr2R, chr3L, chr3R, chr4, chrX]
    # Gene annotation for QC only (TSS metaplots). Chosen so chromosome
    # naming MATCHES the FASTA: UCSC GTF for the chr-prefixed assemblies,
    # Ensembl GFF3 for the bare-named ones. Never used for training.
    annotation_url: https://hgdownload.soe.ucsc.edu/goldenPath/dm6/bigZips/genes/dm6.refGene.gtf.gz
    annotation_format: gtf
    assembly_accession: GCF_000001215.4
    fasta_url: https://hgdownload.soe.ucsc.edu/goldenPath/dm6/bigZips/dm6.fa.gz
    fasta: data/dm6.fa
    # Does this annotation's gene/transcript START mark the TSS?
    # Used ONLY to decide whether the QC metaplot may raise a flag: where this is
    # false the metaplot is advisory, because it measures the annotation's reference
    # point rather than the pipeline. Set from annotation PROVENANCE, not by fitting
    # to the observed ratio. UCSC refGene `transcript` starts are mRNA 5' ends. Observed dn/up 1.8-2.3.
    annotation_tss_anchored: true
    chrom_style: ucsc          # chr2L, chr2R, chr3L, chr3R, chr4, chrX
    star_sa_index_nbases: 12
    blacklist_url: https://raw.githubusercontent.com/Boyle-Lab/Blacklist/master/lists/dm6-blacklist.v2.bed.gz
    blacklist: data/dm6-blacklist.v2.bed.gz
    blacklist_source: >-
      Boyle-Lab/Blacklist v2 (Amemiya et al. 2019); 182 regions, chr-prefixed.
      Fetched at runtime, not redistributed by this repo.
    # Organelle contigs ALREADY IN this assembly. Needed so
    # src/qc/rrna_content.py can measure organellar content -- it would
    # otherwise score only against data/decoy/ and report 0% for every
    # species whose organelles are in the reference, which is 7 of 10.
    # In-assembly rDNA, as contig or contig:start-end (1-based inclusive).
    # Only needed where the annotation carries no `rRNA` feature: the three
    # UCSC species use refGene GTF, which types everything exon/CDS/
    # transcript. Without this, src/qc/rrna_content.py measured 0.9% for
    # D. melanogaster and 0.5% for C. elegans -- organellar only, with
    # nuclear rRNA silently unmeasured but looking like a real number.
    rdna_regions: [chrUn_CP007120v1]   # the whole rDNA scaffold; UCSC renames it from Ensembl's `rDNA`, and CP007120 is "chromosome X; Y rDNA sequence"
    organelle_contigs: [chrM]
    organelle_accessions: []   # chrM is present in dm6 (19,524 bp).
    rdna_accession: null
    #   not needed: dm6 ALREADY CONTAINS the rDNA, as chrUn_CP007120v1 -- CP007120 is
    #   "Drosophila melanogaster chromosome X; Y rDNA sequence", 76,973 bp, the same
    #   scaffold Ensembl BDGP6 exposes under the name `rDNA`. UCSC renames scaffolds to
    #   accession-based chrUn_* names, so grepping contig names for "rDNA" finds nothing
    #   and makes it look absent. Being an unplaced scaffold it is outside chrom_splits,
    #   so it acts as a built-in sink that can never enter a fold. Ignore M21017.1: it is
    #   one ~12 kb repeat unit from a 1988 clone, 6x smaller and long superseded.
    rdna_note: >-
      dm6 retains rDNA-derived scaffolds; the existing preprocessing filters
      "rDNA" and the 211000* scaffolds out of the signal instead of using a decoy.

  M.musculus:
    # mm10 (GRCm38), NOT mm39. ENCODE maps mouse data to mm9/mm10 and its
    # reference is mm10_no_alt_analysis_set_ENCODE.fasta, so mm10 is the standard
    # to remap onto. This overrides the manifest's recommended_realign_assembly
    # column, which says mm39. Consequences of the choice, all favourable:
    #   * coordinates match csRNANet (data/mm10.fa), so mouse models there and
    #     here are directly comparable;
    #   * the canonical peak-matched fold assignment was tuned on mm10;
    #   * exclusion lists exist for mm10 and not for mm39 in Boyle-Lab or ENCODE.
    # Chromosome names are identical between mm10 and mm39 (chr1-chr19, chrX/Y),
    # so the fold assignment in chrom_splits.yaml transfers unchanged.
    assembly: mm10
    n_chromosomes: 20    # 1-19 X; caps PINTS --thread
    # Chromosomes the pipeline actually works on. bigWigs and PINTS are
    # restricted to these: scaffolds cannot enter a fold, and sparse
    # coverage on them makes the pl and mn bigWigs disagree, which PINTS
    # rejects outright ("bw_pl and bw_mn should have the same chromosomes").
    main_chromosomes: [chr1, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chrX]
    # Gene annotation for QC only (TSS metaplots). Chosen so chromosome
    # naming MATCHES the FASTA: UCSC GTF for the chr-prefixed assemblies,
    # Ensembl GFF3 for the bare-named ones. Never used for training.
    annotation_url: https://hgdownload.soe.ucsc.edu/goldenPath/mm10/bigZips/genes/mm10.refGene.gtf.gz
    annotation_format: gtf
    assembly_accession: GCA_000001635.2   # GRCm38
    fasta_url: https://hgdownload.soe.ucsc.edu/goldenPath/mm10/bigZips/mm10.fa.gz
    fasta: data/mm10.fa
    # Does this annotation's gene/transcript START mark the TSS?
    # Used ONLY to decide whether the QC metaplot may raise a flag: where this is
    # false the metaplot is advisory, because it measures the annotation's reference
    # point rather than the pipeline. Set from annotation PROVENANCE, not by fitting
    # to the observed ratio. UCSC refGene `transcript` starts are mRNA 5' ends. Observed dn/up 2.6-4.8.
    annotation_tss_anchored: true
    chrom_style: ucsc
    star_sa_index_nbases: 14
    blacklist_url: https://raw.githubusercontent.com/Boyle-Lab/Blacklist/master/lists/mm10-blacklist.v2.bed.gz
    blacklist: data/mm10-blacklist.v2.bed.gz
    blacklist_source: >-
      Boyle-Lab/Blacklist v2; 3435 regions, chr-prefixed. ENCODE's own mouse
      exclusion list (ENCSR064IDX) is also mm10/mm9 only. A stricter alternative
      is mm10.Kundaje.mm10.Excludable (164 regions) via excluderanges.
    # Organelle contigs ALREADY IN this assembly. Needed so
    # src/qc/rrna_content.py can measure organellar content -- it would
    # otherwise score only against data/decoy/ and report 0% for every
    # species whose organelles are in the reference, which is 7 of 10.
    # In-assembly rDNA, as contig or contig:start-end (1-based inclusive).
    # Only needed where the annotation carries no `rRNA` feature: the three
    # UCSC species use refGene GTF, which types everything exon/CDS/
    # transcript. Without this, src/qc/rrna_content.py measured 0.9% for
    # D. melanogaster and 0.5% for C. elegans -- organellar only, with
    # nuclear rRNA silently unmeasured but looking like a real number.
    rdna_regions: []   # measured via the rdna_accession sink instead
    organelle_contigs: [chrM]
    organelle_accessions: []   # chrM is present in mm10 (16,299 bp).
    rdna_accession: BK000964.3
    #   verified: TPA, 45,306 bp, 'Mus musculus ribosomal DNA, complete repeating
    #   unit' -- the exact analogue of the human U13369.1 ENCODE uses. Mouse rDNA
    #   is absent from mm10 -- verified properly, not by grepping contig names, which is
    #   the check that wrongly cleared dm6: the largest mm10 unplaced scaffolds near 45 kb
    #   (GL456366, GL456367, GL456239) are generic unplaced/unlocalized contigs, and
    #   BK000964 being a Third Party Annotation record is itself a sign the sequence was
    #   never deposited as primary assembly data.
    rdna_note: >-
      Mouse, like human, has rDNA largely absent from the primary assembly, so an
      rDNA decoy matters most here. Resolve the accession before large-scale runs.

  C.elegans:
    assembly: ce11             # modENCODE/ENCODE standard for C. elegans
    n_chromosomes: 6    # I-V X; caps PINTS --thread
    # Chromosomes the pipeline actually works on. bigWigs and PINTS are
    # restricted to these: scaffolds cannot enter a fold, and sparse
    # coverage on them makes the pl and mn bigWigs disagree, which PINTS
    # rejects outright ("bw_pl and bw_mn should have the same chromosomes").
    main_chromosomes: [chrI, chrII, chrIII, chrIV, chrV, chrX]
    # Gene annotation for QC only (TSS metaplots). Chosen so chromosome
    # naming MATCHES the FASTA: UCSC GTF for the chr-prefixed assemblies,
    # Ensembl GFF3 for the bare-named ones. Never used for training.
    annotation_url: https://hgdownload.soe.ucsc.edu/goldenPath/ce11/bigZips/genes/ce11.refGene.gtf.gz
    annotation_format: gtf
    assembly_accession: GCF_000002985.6
    fasta_url: https://hgdownload.soe.ucsc.edu/goldenPath/ce11/bigZips/ce11.fa.gz
    fasta: data/ce11.fa
    # Does this annotation's gene/transcript START mark the TSS?
    # Used ONLY to decide whether the QC metaplot may raise a flag: where this is
    # false the metaplot is advisory, because it measures the annotation's reference
    # point rather than the pipeline. Set from annotation PROVENANCE, not by fitting
    # to the observed ratio. refGene `transcript` starts are POST-TRANS-SPLICING mature 5' ends; the real
    #   TSS lies upstream across the outron. Not an annotation defect -- a biological
    #   one, and unfixable by changing annotation source. Observed dn/up 0.45-0.95.
    annotation_tss_anchored: false
    chrom_style: ucsc          # chrI..chrV, chrX
    star_sa_index_nbases: 12
    blacklist_url: https://raw.githubusercontent.com/Boyle-Lab/Blacklist/master/lists/ce11-blacklist.v2.bed.gz
    blacklist: data/ce11-blacklist.v2.bed.gz
    blacklist_source: >-
      Boyle-Lab/Blacklist v2; 97 regions, chr-prefixed. Fetched at runtime, not
      redistributed by this repo.
    # Organelle contigs ALREADY IN this assembly. Needed so
    # src/qc/rrna_content.py can measure organellar content -- it would
    # otherwise score only against data/decoy/ and report 0% for every
    # species whose organelles are in the reference, which is 7 of 10.
    # In-assembly rDNA, as contig or contig:start-end (1-based inclusive).
    # Only needed where the annotation carries no `rRNA` feature: the three
    # UCSC species use refGene GTF, which types everything exon/CDS/
    # transcript. Without this, src/qc/rrna_content.py measured 0.9% for
    # D. melanogaster and 0.5% for C. elegans -- organellar only, with
    # nuclear rRNA silently unmeasured but looking like a real number.
    rdna_regions: [chrI:15062083-15071033]   # 18S-26S-18S. NOTE chrI, not I: ce11 is chr-prefixed, and the bare name would index NOTHING
    organelle_contigs: [chrM]
    organelle_accessions: []   # chrM is present in ce11 (13,794 bp).
    rdna_accession: null
    #   not needed: the array is IN the assembly at I:15062083-15071033 (18S, 26S, 18S).
    #   Reads map to their true source, so there is nothing spurious to redirect.
    rdna_note: >-
      C. elegans mature mRNAs are frequently SL1/SL2 trans-spliced, which
      separates RNA 5' ends from true initiation sites. Treat TSS labels derived
      from this species with care and do not validate against mature-mRNA
      annotation alone (manifest Field Guide, "C. elegans caveat").

  S.cerevisiae:
    assembly: R64-1-1
    n_chromosomes: 16    # I-XVI; caps PINTS --thread
    # Chromosomes the pipeline actually works on. bigWigs and PINTS are
    # restricted to these: scaffolds cannot enter a fold, and sparse
    # coverage on them makes the pl and mn bigWigs disagree, which PINTS
    # rejects outright ("bw_pl and bw_mn should have the same chromosomes").
    main_chromosomes: [I, II, III, IV, IX, V, VI, VII, VIII, X, XI, XII, XIII, XIV, XV, XVI]
    # Gene annotation for QC only (TSS metaplots). Chosen so chromosome
    # naming MATCHES the FASTA: UCSC GTF for the chr-prefixed assemblies,
    # Ensembl GFF3 for the bare-named ones. Never used for training.
    annotation_url: http://ftp.ensemblgenomes.org/pub/release-35/fungi/gff3/saccharomyces_cerevisiae/Saccharomyces_cerevisiae.R64-1-1.35.gff3.gz
    annotation_format: gff3
    assembly_accession: GCA_000146045.2
    fasta_url: http://ftp.ensemblgenomes.org//pub/release-35/fungi/fasta/saccharomyces_cerevisiae/dna/Saccharomyces_cerevisiae.R64-1-1.dna.toplevel.fa.gz
    fasta: data/Saccharomyces_cerevisiae.R64-1-1.dna.toplevel.fa
    # Does this annotation's gene/transcript START mark the TSS?
    # Used ONLY to decide whether the QC metaplot may raise a flag: where this is
    # false the metaplot is advisory, because it measures the annotation's reference
    # point rather than the pipeline. Set from annotation PROVENANCE, not by fitting
    # to the observed ratio. Ensembl R64 `gene` start is the ATG, not the TSS; yeast 5'UTRs put the real TSS
    #   ~20-60 bp upstream. Observed dn/up 0.23-0.99, and the metaplot peak sits at
    #   -30 to -20, which is exactly the 5'UTR length.
    annotation_tss_anchored: false
    chrom_style: ensembl       # roman numerals, no chr prefix
    star_sa_index_nbases: 10
    blacklist: null
    blacklist_source: >-
      None published. Neither Boyle-Lab/Blacklist nor excluderanges has a
      sacCer3/R64-1-1 set, and yeast is not an ENCODE/modENCODE organism. csRNANet's
      convention is likewise to use exclusion lists for H.sapiens and
      M.musculus only.
    # Organelle contigs ALREADY IN this assembly. Needed so
    # src/qc/rrna_content.py can measure organellar content -- it would
    # otherwise score only against data/decoy/ and report 0% for every
    # species whose organelles are in the reference, which is 7 of 10.
    # In-assembly rDNA, as contig or contig:start-end (1-based inclusive).
    # Only needed where the annotation carries no `rRNA` feature: the three
    # UCSC species use refGene GTF, which types everything exon/CDS/
    # transcript. Without this, src/qc/rrna_content.py measured 0.9% for
    # D. melanogaster and 0.5% for C. elegans -- organellar only, with
    # nuclear rRNA silently unmeasured but looking like a real number.
    rdna_regions: []   # GFF3 rRNA features cover it
    organelle_contigs: [Mito]
    organelle_accessions: []   # Mito is present in R64-1-1 (85,779 bp).
    rdna_accession: null
    #   not needed: the 35S array is IN the assembly at XII:451786-489469 (RDN37-1/2 plus
    #   RDN5-1..6), so reads land on their true locus. Not spurious, so nothing to sink and
    #   nothing to mask.
    rdna_note: >-
      The RDN37 rDNA array is inside chrXII of the primary assembly, so a
      separate decoy is less critical than for mammals.

  S.pombe:
    assembly: ASM294v2
    n_chromosomes: 3    # I II III; caps PINTS --thread
    # Chromosomes the pipeline actually works on. bigWigs and PINTS are
    # restricted to these: scaffolds cannot enter a fold, and sparse
    # coverage on them makes the pl and mn bigWigs disagree, which PINTS
    # rejects outright ("bw_pl and bw_mn should have the same chromosomes").
    main_chromosomes: [I, II, III]
    # Gene annotation for QC only (TSS metaplots). Chosen so chromosome
    # naming MATCHES the FASTA: UCSC GTF for the chr-prefixed assemblies,
    # Ensembl GFF3 for the bare-named ones. Never used for training.
    annotation_url: http://ftp.ensemblgenomes.org/pub/release-60/fungi/gff3/schizosaccharomyces_pombe/Schizosaccharomyces_pombe.ASM294v2.60.gff3.gz
    annotation_format: gff3
    assembly_accession: GCA_000002945.2
    fasta_url: http://ftp.ensemblgenomes.org/pub/release-60/fungi/fasta/schizosaccharomyces_pombe/dna/Schizosaccharomyces_pombe.ASM294v2.dna.toplevel.fa.gz
    fasta: data/Schizosaccharomyces_pombe.ASM294v2.dna.toplevel.fa
    # Does this annotation's gene/transcript START mark the TSS?
    # Used ONLY to decide whether the QC metaplot may raise a flag: where this is
    # false the metaplot is advisory, because it measures the annotation's reference
    # point rather than the pipeline. Set from annotation PROVENANCE, not by fitting
    # to the observed ratio. Ensembl, but PomBase-curated with real UTRs. Observed dn/up 2.71 -- the internal
    #   control that shows the S.cerevisiae failure is annotation, not 'yeast'.
    annotation_tss_anchored: true
    chrom_style: ensembl
    star_sa_index_nbases: 10
    blacklist: null
    blacklist_source: >-
      None published. Neither Boyle-Lab/Blacklist nor excluderanges has a
      ASM294v2 set, and yeast is not an ENCODE/modENCODE organism. csRNANet's
      convention is likewise to use exclusion lists for H.sapiens and
      M.musculus only.
    # Organelle contigs ALREADY IN this assembly. Needed so
    # src/qc/rrna_content.py can measure organellar content -- it would
    # otherwise score only against data/decoy/ and report 0% for every
    # species whose organelles are in the reference, which is 7 of 10.
    # In-assembly rDNA, as contig or contig:start-end (1-based inclusive).
    # Only needed where the annotation carries no `rRNA` feature: the three
    # UCSC species use refGene GTF, which types everything exon/CDS/
    # transcript. Without this, src/qc/rrna_content.py measured 0.9% for
    # D. melanogaster and 0.5% for C. elegans -- organellar only, with
    # nuclear rRNA silently unmeasured but looking like a real number.
    rdna_regions: []   # GFF3 rRNA features cover it
    organelle_contigs: [MT]
    organelle_accessions: []   # MT is present in ASM294v2.
    rdna_accession: null
    #   not needed: arrays are IN the assembly at both ends of III (1-23130 and
    #   2440994-2452883). NB these are typed `rRNA` under `ncRNA_gene`, not `rRNA_gene` --
    #   filtering on rRNA_gene makes chromosome III look empty.
    rdna_note: rDNA repeats are present on chromosome III in the primary assembly.

  A.thaliana:
    assembly: TAIR10
    n_chromosomes: 5    # 1-5; caps PINTS --thread
    # Chromosomes the pipeline actually works on. bigWigs and PINTS are
    # restricted to these: scaffolds cannot enter a fold, and sparse
    # coverage on them makes the pl and mn bigWigs disagree, which PINTS
    # rejects outright ("bw_pl and bw_mn should have the same chromosomes").
    main_chromosomes: [1, 2, 3, 4, 5]
    # Gene annotation for QC only (TSS metaplots). Chosen so chromosome
    # naming MATCHES the FASTA: UCSC GTF for the chr-prefixed assemblies,
    # Ensembl GFF3 for the bare-named ones. Never used for training.
    annotation_url: http://ftp.ensemblgenomes.org/pub/plants/release-58/gff3/arabidopsis_thaliana/Arabidopsis_thaliana.TAIR10.58.gff3.gz
    annotation_format: gff3
    assembly_accession: GCA_000001735.1
    fasta_url: http://ftp.ensemblgenomes.org/pub/plants/release-58/fasta/arabidopsis_thaliana/dna/Arabidopsis_thaliana.TAIR10.dna.toplevel.fa.gz
    fasta: data/Arabidopsis_thaliana.TAIR10.dna.toplevel.fa
    # Does this annotation's gene/transcript START mark the TSS?
    # Used ONLY to decide whether the QC metaplot may raise a flag: where this is
    # false the metaplot is advisory, because it measures the annotation's reference
    # point rather than the pipeline. Set from annotation PROVENANCE, not by fitting
    # to the observed ratio. TAIR10 gene models carry UTRs. Observed dn/up 8.07.
    annotation_tss_anchored: true
    chrom_style: ensembl       # 1-5, Mt, Pt (not an ENCODE organism)
    star_sa_index_nbases: 12
    blacklist: config/blacklists/TAIR10.Klasfeld.Excludable.bed.gz
    blacklist_source: >-
      TAIR10.Klasfeld.arabidopsis_Excludable_20inputs (83 regions), from Zenodo
      10.5281/zenodo.21480958; Klasfeld et al. 10.1101/2022.02.27.482177.
      Chosen because it is the SAME Boyle-Lab/Blacklist software used for dm6,
      ce11 and mm10 -- High Signal and Low Mappability regions -- just run over
      20 Arabidopsis inputs, so it is methodologically comparable. Preferred
      over the peakPass set (887 regions), which predicts regions with an ML
      classifier over annotation features including GENES, a circularity hazard
      for a TSS model. Distributed only as R .rds, so converted to BED and
      versioned in-repo; published as chr1-chr5, stripped to bare 1-5 to match
      the Ensembl Plants FASTA. License CC-BY-4.0. See
      config/blacklists/README.md.
    # Organelle contigs ALREADY IN this assembly. Needed so
    # src/qc/rrna_content.py can measure organellar content -- it would
    # otherwise score only against data/decoy/ and report 0% for every
    # species whose organelles are in the reference, which is 7 of 10.
    # In-assembly rDNA, as contig or contig:start-end (1-based inclusive).
    # Only needed where the annotation carries no `rRNA` feature: the three
    # UCSC species use refGene GTF, which types everything exon/CDS/
    # transcript. Without this, src/qc/rrna_content.py measured 0.9% for
    # D. melanogaster and 0.5% for C. elegans -- organellar only, with
    # nuclear rRNA silently unmeasured but looking like a real number.
    rdna_regions: []   # GFF3 rRNA features cover it
    organelle_contigs: [Mt, Pt]
    organelle_accessions: []   # Mt (366,924 bp) and Pt (154,478 bp) are both present in TAIR10.
    rdna_accession: null
    #   not needed: rDNA is IN the assembly at 2:3706-5945 and 3:14197677-14199916 (both
    #   also fall inside the shipped TAIR10 exclusion list, incidentally).
    rdna_note: >-
      Plastid (Pt) and mitochondrial (Mt) sequences soak up a large fraction of
      run-on reads; exclude them from peaks and negatives.

  # ---------------------------------------------------------------------------
  # Species added with the McDonald2024 / Shamie2021 / Tome2018 manifest update.
  # None is an ENCODE/modENCODE organism, so all four keep the bare Ensembl
  # chromosome names their FASTAs use, exactly like the yeasts and Arabidopsis.
  # No published exclusion list exists for any of them -- see the "no outlier
  # filter" note in CLAUDE.md for what that leaves as the only guards.
  # ---------------------------------------------------------------------------

  C.reinhardtii:
    # Fold assignment is CANONICAL: identical in csRNANet
    # (configs/splits/C.reinhardtii_data_fold_assignments.csv) and plant-design
    # (configs/chrom_splits.yaml), verified equal to each other and copied
    # unchanged. Do not retune -- diverging folds make models incomparable.
    assembly: Chlamydomonas_reinhardtii_v5.5
    n_chromosomes: 17   # 1-17; caps PINTS --thread
    main_chromosomes: [1, 10, 11, 12, 13, 14, 15, 16, 17, 2, 3, 4, 5, 6, 7, 8, 9]
    # NOTE the division: Chlamydomonas moved from Ensembl **protists** to
    # **plants**. csRNANet's download_genomes.sh still points at
    # protists/release-55, which now 404s. The assembly (v5.5) is unchanged, so
    # chromosome names and the fold assignment are unaffected.
    annotation_url: http://ftp.ensemblgenomes.org/pub/plants/release-63/gff3/chlamydomonas_reinhardtii/Chlamydomonas_reinhardtii.Chlamydomonas_reinhardtii_v5.5.63.gff3.gz
    annotation_format: gff3
    assembly_accession: GCA_000002595.3
    fasta_url: http://ftp.ensemblgenomes.org/pub/plants/release-63/fasta/chlamydomonas_reinhardtii/dna/Chlamydomonas_reinhardtii.Chlamydomonas_reinhardtii_v5.5.dna.toplevel.fa.gz
    fasta: data/Chlamydomonas_reinhardtii.Chlamydomonas_reinhardtii_v5.5.dna.toplevel.fa
    # Does this annotation's gene/transcript START mark the TSS?
    # Used ONLY to decide whether the QC metaplot may raise a flag: where this is
    # false the metaplot is advisory, because it measures the annotation's reference
    # point rather than the pipeline. Set from annotation PROVENANCE, not by fitting
    # to the observed ratio. Ensembl v5.5 models carry UTRs. Observed dn/up 1.29 -- weakest of the anchored
    #   set, so treat its metaplot with more caution than the others.
    annotation_tss_anchored: true
    chrom_style: ensembl       # bare 1-17, plus MT/cpDNA and scaffolds
    star_sa_index_nbases: 12   # 111.1 Mb over 53 top-level regions
    blacklist: null
    blacklist_source: >-
      None published. Not in Boyle-Lab/Blacklist (ce10, ce11, dm3, dm6, hg19,
      hg38, mm10 only) and no excluderanges entry.
    # Organelle decoys. The Ensembl dna.toplevel FASTA for this assembly holds
    # ONLY numbered chromosomes and unplaced scaffolds -- no chloroplast, no
    # mitochondrion -- verified by searching 15 random 30-mers from each
    # organelle genome against the assembly on both strands (0/15 chloroplast,
    # 1/15 mitochondrion, the single hit being NUMT-level). Do NOT check this by
    # contig length: KZ454947 is within 5% of the chloroplast's length and holds
    # none of its sequence.
    # 12.2% of C.reinhardtii-liquidculture_5GRO is organellar (12.1% plastid,
    # 0.1% mito) and had nowhere to map.
    # Organelle contigs ALREADY IN this assembly. Needed so
    # src/qc/rrna_content.py can measure organellar content -- it would
    # otherwise score only against data/decoy/ and report 0% for every
    # species whose organelles are in the reference, which is 7 of 10.
    # In-assembly rDNA, as contig or contig:start-end (1-based inclusive).
    # Only needed where the annotation carries no `rRNA` feature: the three
    # UCSC species use refGene GTF, which types everything exon/CDS/
    # transcript. Without this, src/qc/rrna_content.py measured 0.9% for
    # D. melanogaster and 0.5% for C. elegans -- organellar only, with
    # nuclear rRNA silently unmeasured but looking like a real number.
    rdna_regions: []   # GFF3 rRNA features cover it
    organelle_contigs: []  # absent; supplied via organelle_accessions
    organelle_accessions: [BK000554, U03843]   # cpDNA 203,828 bp; mtDNA 15,758 bp
    rdna_accession: null
    #   not needed: the array IS in the assembly. Checked via annotation biotype, not
    #   contig names: release-63 GFF3 has 34 rRNA genes, including a full-length
    #   SSU_rRNA_eukarya (1,790 bp) plus LSU copies at the subtelomeric start of
    #   chromosome 1 (~1.1-19.1 kb) and a second SSU/5.8S cluster on chromosome 14
    #   (~4,145,334-4,154,986). Chlamydomonas rDNA is known to be subtelomeric.
    rdna_note: >-
      Organelles (MT, cpDNA) soak up run-on reads and stay in the index as
      decoys; they are outside main_chromosomes so they cannot enter a fold.

