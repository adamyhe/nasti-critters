    # 8.6% of P.patens-plateculture_5GRO is organellar (8.1% plastid, 0.5% mito).
    # Organelle contigs ALREADY IN this assembly. Needed so
    # src/qc/rrna_content.py can measure organellar content -- it would
    # otherwise score only against data/decoy/ and report 0% for every
    # species whose organelles are in the reference, which is 7 of 10.
    # In-assembly rDNA, as contig or contig:start-end (1-based inclusive).
