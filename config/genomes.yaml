    # THE ONLY SPECIES HERE WITH NO CHROMOSOMES AT ALL. v1.0 is a 759-scaffold
    # JGI draft: Ensembl reports an EMPTY karyotype and zero chromosome-coord
    # regions, 212.6 Mb total, N50 1.75 Mb, largest scaffold 6.95 Mb.
    # Chromosome-level folds are therefore impossible, so this species uses
    # PEAK-LEVEL folds -- the same mechanism as S. pombe, and for the same
    # reason. It is deliberately ABSENT from config/chrom_splits.yaml; build its
    # folds with make_random_splits.py (which is already generic --
    # it takes --experiment/--peaks/--output) once peaks exist:
    #   python src/data_preprocessing/make_random_splits.py     #     -e S.moellendorffii-stemleaf_5GRO     #     -o config/splits/S.moellendorffii_random_fold_assignments.csv
    assembly: v1.0
    # main_chromosomes is the 189 nuclear scaffolds >= 100 kb, which carry 97.0%
    # of the assembly. The plastid Pt (143,775 bp) also clears the cutoff but is
    # EXCLUDED, like A. thaliana's Mt/Pt: organelles are index decoys, not fold
    # members. The 569 dropped scaffolds are mostly < 10 kb (median 8 kb) and
    # cannot host an in_window=2114 training window away from a contig edge.
    # WATCH THIS ONE: it is the species most likely to hit the pl/mn contig
    # mismatch that PINTS rejects ("bw_pl and bw_mn should have the same
    # chromosomes"), because bedGraphToBigWig records only contigs present in
    # its input and sparse scaffolds can have reads on one strand only. If that
    # fires, RAISE the cutoff (>= 500 kb keeps 118 scaffolds and 87.7%) rather
    # than dropping the species.
    n_chromosomes: 8    # caps PINTS --thread; 190 scaffolds, so the cap binds
