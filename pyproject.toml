# Python dependencies, managed by uv.
#
#     uv sync                          # create .venv and install (writes uv.lock)
#     uv run python src/data_preprocessing/resolve_runs.py
#
# Non-Python tools (fastp, STAR, samtools, bedtools, bedops, htslib, UCSC) come
# from environment.yml via mamba. See that file for the activation order.
#
# This is not an installable package -- `[tool.uv] package = false` keeps uv
# from trying to build it. The repo is a set of scripts run in place.

[project]
name = "nasti-critters"
version = "0.0.0"
description = "Sequence-to-function models of PRO-cap initiation profiles in non-human species"
requires-python = ">=3.11"

# THE BASE SET IS TORCH-FREE, deliberately. Everything here installs from wheels
# on any glibc, so `uv sync` with no extras works on Sherlock, whose tier has no
# manylinux wheel for torch above 2.6.0. Sherlock runs the CPU-demanding jobs --
# tfmodisco above all -- and needs nothing more than this.
#
# Everything that pulls torch lives in the `torch` extra below. Before adding a
# dependency here, check `pip download <pkg> --no-deps` and read its
# Requires-Dist: tangermeme (torch>=2.0) and bpnet-lite (torch>=1.9.0) both look
# innocuous and are not.
dependencies = [
    # tfmodisco-lite. A transitive dep of bpnet-lite too, but declared directly
    # because src/bpnet/modisco/ invokes its `modisco` CLI -- same reasoning as
    # pybigtools. It ships the entry point as an old-style data/scripts/modisco
    # rather than a console_script. Needs NO torch: numpy, scipy, numba,
    # scikit-learn, leidenalg, igraph, tqdm, pandas, logomaker, h5py,
    # hdf5plugin, memelite.
    "modisco-lite>=2.0.0",
    # leidenalg 0.11.0 moved its linux wheels from manylinux_2_17 to
    # manylinux_2_26/2_28, so on Sherlock -- glibc < 2.28, the same boundary
    # that caps torch at 2.6.0, which is manylinux1 where 2.7.0 is 2_28 -- uv
    # falls back to an sdist build that fails. 0.10.2 is the last release with a
    # 2_17 wheel, and procap-atlas pins the identical version for the identical
    # reason. It arrives via modisco-lite (leidenalg>=0.8.10), which is why a
    # tfmodisco-only install is affected at all.
    "leidenalg==0.10.2",
    # igraph is leidenalg's own dependency and made the same jump: 1.0.0 is
    # 2_28-only, 0.11.9 is the last with a 2_17 wheel.
    "igraph<1.0",
    # pillow 12.3.0 dropped manylinux_2_17; same pin as procap-atlas.
    "pillow<12.3.0",
    # --- analysis / plotting ---
    # Both arrive transitively (matplotlib via logomaker via modisco-lite,
    # scipy via several), but src/analysis/ imports them directly.
    "matplotlib",
    "scipy",

    # NOTE: the ENCODE pipeline's Python-side tools are NOT here. pyPINTS
    # (pints_caller) and umi-tools are both CLI tools that this repo only ever
    # shells out to -- never imports -- so they live in environment.yml with
    # fastp/STAR/samtools. Moving either back would also reintroduce their
    # dependency tails (biopython, pybedtools, statsmodels for pyPINTS) and, for
    # umi-tools, the only sdist build in the tree.

    # --- workflow ---

    # --- data handling used across src/ ---
    "numpy",
    "pandas",
    "pyyaml",
    "joblib",    # benchmark_predictions.py
    # pybigtools is DIRECT, not merely transitive via tangermeme: since
    # make_negatives.py merges the two strand bigWigs in-process, src/ imports
    # it, and a package you import belongs in the dependency list whatever else
    # happens to pull it in. pyfaidx is still transitive (tangermeme's
    # extract_loci uses both). Do not add pyfastx or pyBigWig back -- those are
    # the readers this repo deliberately does not use.
    "pybigtools",
    "tqdm",
]

# NO encode-exact extra. ENCODE converts BAM -> bigWig and merges replicates
# with biodatatools 0.0.7, but the source document does not record the
# subcommand, so that path was never implemented -- nothing imports
# biodatatools and no code reads a backend switch. An extra that installs an
# unused package is a promise the repo cannot keep, so it is gone; the pin is
# kept here as provenance for whoever implements it.

[project.optional-dependencies]
# EVERYTHING THAT NEEDS TORCH, in one extra.
#
#     uv sync                 # torch-free: tfmodisco, analysis, the launchers
#     uv sync --extra torch   # adds training, benchmarking, attribution
#
# The split is by DEPENDENCY, not by task: tangermeme and bpnet-lite both
# require torch, so every script importing either belongs on the torch side even
# where the science does not obviously involve a model. That is fit_*,
# benchmark_*, attribute.py, make_negatives.py, and
# filter_nonACGT_regions.py --save-ohe (the filtering itself is torch-free; only
# the one-hot encoding, which goes through extract_loci, is not).
#
# Sherlock CANNOT install this extra, which is the whole point of separating it:
# its glibc tier has no manylinux wheel for torch above 2.6.0, newer versions
# fall back to an sdist build that fails, and 2.6.0 is too old for cherimoya's
# torch.optim.Muon (2.10). conda-forge ships newer torch builds, but they do not
# reliably use CUDA -- tried and rejected, see CLAUDE.md. So GPU work happens on
# modern-glibc hardware and Sherlock gets the base set.
#
# torch >= 2.10 for torch.optim.Muon. fit_cherimoya.py raises a pointed error
# rather than falling back to PyPI muon, which is a multi-omics framework and
# not the optimizer, so muon is deliberately not a dependency.
#
# cherimoya is pinned by commit via tool.uv.sources below, not by version: 0.2.1
# was never released to PyPI. It differs from the published 0.2.0 only by a
# __version__ attribute in __init__.py -- cheri.py, cherimoya.py, io.py,
# losses.py, performance.py and wrappers.py are byte-identical (verified by
# installing both). The pin buys exact agreement with the container image and
# immunity to tag movement, NOT different training results.
torch = [
    "torch>=2.10",
    "bpnet-lite>=1.0.0",
    "tangermeme>=1.0.0",
    "cherimoya",
]

[tool.uv]
# The sherlock pin (torch==2.6.0) and the cherimoya extra (torch>=2.10) are
# never installed together, so let uv resolve them independently rather than
# failing to find one universal torch that satisfies both.
conflicts = [
    [
        { extra = "sherlock" },
        { extra = "cherimoya" },
    ],
]


# macs3 is a transitive dependency of both bpnet-lite and cherimoya, and NOTHING
# in this repo imports it. It ships no wheels at any version, so uv builds it
# from sdist -- dragging in cykhash, also sdist-only -- which is the slowest part
# of a clean install and pure waste here. The upstream sherlock image drops it
# the same way, with `pip install --no-deps`.
#
# An unsatisfiable marker is how a transitive dependency is excluded in uv: the
# override replaces the requirement coming from bpnet-lite/cherimoya, and the
# marker is never true, so it resolves to nothing rather than to a version.
# If something here ever imports macs3, delete these two lines -- do not "fix"
# it by pinning a version.
override-dependencies = [
    "macs3 ; sys_platform == 'nonexistent'",
    "cykhash ; sys_platform == 'nonexistent'",
]
package = false

# hdf5plugin, pulled in by modisco-lite, publishes no manylinux_2_17 wheel and
# so always builds from source on Sherlock. Its build script probes the host and
# adds -march=native, which makes GCC auto-vectorise the popcount loops in the
# bundled SPERR sources into AVX512-VPOPCNTDQ instructions that Sherlock's
# assembler cannot assemble. Disabling native also keeps the login node's ISA
# out of filter plugins that jobs load on older compute nodes. Taken from
# procap-atlas, which hit this on the same cluster.
extra-build-variables = { hdf5plugin = { HDF5PLUGIN_NATIVE = "False" } }

[tool.uv.sources]
# Match the authoritative Apptainer image at
# https://github.com/adamyhe/sherlock (cherimoya/cherimoya.def), which installs
# this exact commit (the 0.2.1 version bump, 2026-07-28). PyPI only ever
# published 0.2.0 (2026-07-14), so 0.2.1 is reachable from git only.
#
# The functional difference is nil: every module except __init__.py is
# byte-identical between the git commit and the PyPI wheel, and the addition is
# just a __version__ attribute. The EMA / valid_count_corr rewrite that the
# upstream image comment attributes to this commit landed *before* 0.2.0 was
# published -- both artifacts contain valid_count_corr and swa identically.
#
# Keep the pin anyway: it guarantees byte agreement with the image, and the
# upstream v0.2.0 tag has already been force-moved once, so a tag or version
# range is not a stable reference. But do not expect different training results
# from relaxing it.
cherimoya = { git = "https://github.com/jmschrei/cherimoya.git", rev = "8e4283fe56db4a29418c1d8119da3240d7c709ba" }

# On a GPU cluster the default linux torch wheel already bundles CUDA. If you
# need a specific CUDA build, pin an index instead of editing the dependency:
#
# [[tool.uv.index]]
# name = "pytorch-cu126"
# url = "https://download.pytorch.org/whl/cu126"
# explicit = true
#
# [tool.uv.sources]
# torch = { index = "pytorch-cu126" }
